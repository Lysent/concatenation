name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Technic release
        run: |
          mkdir -p temp
          rsync -av --exclude='.git' --exclude='.github' . temp/
          cd temp
          zip -r ../release.zip .
          mv ../release.zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
