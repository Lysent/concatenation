	"Particle Threshold" = 200.0
	#Particles that spawn when a entity is hit while wearing armor.
	"Sparkle Particles" = true
	"Sparkle Amount" = 15.0

[sound_effects]
	"Hit Sound Effects" = true
	#Death sound effects.
	"Kill Sound Effects" = true

[death_particles]
	#Particles that spawn when a entitiy dies
	"Death Particles" = true
	#Particle amount upon a entities death.
	"Death Particle Amount" = 50.0

